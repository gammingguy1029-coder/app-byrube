name: Build RizzBoard APK

on:
  # Build on every push to main AND when you tag a version (v1.1.0 etc.)
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
    paths-ignore: [ "*.md", ".gitignore" ]
  # Manual button in the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned to Ubuntu 24.04 on purpose: ubuntu-latest migrated to Ubuntu 26
    # (Oct 2026) and the new image has no preinstalled Android SDK, which
    # broke the build with exit code 126.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Installs a self-contained Android SDK (cmdline-tools + platform-tools)
      # so the build does not depend on anything preinstalled on the runner.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --max-workers=4 -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" 2>&1 | tee build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RizzBoardAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # If the build ever fails, the tail of the Gradle log is pushed to the
      # "ci-logs" branch so it can be inspected without opening the Actions page.
      - name: Record failure log
        if: failure()
        run: |
          tail -c 30000 build.log > ci-build-log.txt || true
          git config user.name "ci-log"
          git config user.email "ci-log@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . -q || true
          git add ci-build-log.txt
          git commit -m "Build log from run ${{ github.run_id }}"
          git push -f origin ci-logs

  release:
    # Only runs when you push a tag like v1.1.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: RizzBoardAI-debug-apk
          path: apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
