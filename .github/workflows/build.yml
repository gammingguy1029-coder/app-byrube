name: Build RizzBoard APK

on:
  # Build on every push to main AND when you tag a version (v1.1.0 etc.)
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
    paths-ignore: [ "*.md", ".gitignore" ]
  # Manual button in the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        # GitHub runners are more powerful than the local workspace was,
        # so we lift the memory limits from gradle.properties for this build.
        run: >
          ./gradlew :app:assembleDebug
          --max-workers=4
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RizzBoardAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    # Only runs when you push a tag like v1.1.0
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: RizzBoardAI-debug-apk
          path: apk

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
